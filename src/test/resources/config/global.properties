screenshots.path=screenshots/
testdata.path=src/test/resources/testdata/
global.timeout=30


# Environment: local, saucelabs, browserstack
env=local
browser=chrome

# Sauce Labs configuration
sauce.username=your_sauce_username
sauce.accessKey=your_sauce_access_key
sauce.platform=Windows 10
sauce.browserVersion=latest
sauce.testName=Sample SauceLabs Test

# BrowserStack configuration
bs.username=your_bs_username
bs.accessKey=your_bs_access_key
bs.os=Windows
bs.osVersion=10
bs.browserVersion=latest
bs.testName=Sample BrowserStack Test
name: OrangeHRM Selenium CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
      browser:
        description: "Browser to run"
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - safari
          - all
      env:
        description: "Environment to run against"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - ppe

permissions:
  contents: write

jobs:
  resolve-linux-matrix:
    name: Resolve Linux browser matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_linux: ${{ steps.set-matrix.outputs.has_linux }}
    steps:
      - name: Build browser matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BROWSER: ${{ inputs.browser }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            selected_browser="$DISPATCH_BROWSER"
          else
            selected_browser="chrome"
          fi

          case "$selected_browser" in
            all)
              echo 'matrix={"include":[{"browser":"chrome","image":"selenium/standalone-chrome:latest"},{"browser":"firefox","image":"selenium/standalone-firefox:latest"},{"browser":"edge","image":"selenium/standalone-edge:latest"}]}' >> "$GITHUB_OUTPUT"
              echo "has_linux=true" >> "$GITHUB_OUTPUT"
              ;;
            chrome)
              echo 'matrix={"include":[{"browser":"chrome","image":"selenium/standalone-chrome:latest"}]}' >> "$GITHUB_OUTPUT"
              echo "has_linux=true" >> "$GITHUB_OUTPUT"
              ;;
            firefox)
              echo 'matrix={"include":[{"browser":"firefox","image":"selenium/standalone-firefox:latest"}]}' >> "$GITHUB_OUTPUT"
              echo "has_linux=true" >> "$GITHUB_OUTPUT"
              ;;
            edge)
              echo 'matrix={"include":[{"browser":"edge","image":"selenium/standalone-edge:latest"}]}' >> "$GITHUB_OUTPUT"
              echo "has_linux=true" >> "$GITHUB_OUTPUT"
              ;;
            safari)
              echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              echo "has_linux=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported browser input: $selected_browser"
              exit 1
              ;;
          esac
  

  test-linux:
    name: Test (${{ matrix.browser }})
    needs: resolve-linux-matrix
    runs-on: ubuntu-latest
    if: needs.resolve-linux-matrix.outputs.has_linux == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-linux-matrix.outputs.matrix) }}
    services:
      selenium:
        image: ${{ matrix.image }}
        ports:
          - 4444:4444
        options: --shm-size=2g

    env:
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}
      SELENIUM_REMOTE_URL: http://127.0.0.1:4444/wd/hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Wait for Selenium
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4444/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Selenium service did not become ready"
          exit 1

      - name: Build and run tests
        run: |
          ./gradlew clean test \
            -DsuiteXmlFile=src/test/resources/suites/${SUITE}.xml \
            -Denv=${TEST_ENV} \
            -Dbrowser=${{ matrix.browser }} \
            -Dplatform=grid \
            -DseleniumRemoteUrl=${SELENIUM_REMOTE_URL}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/reports
            target/test-results
          if-no-files-found: warn
          retention-days: 7

  allure-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs:
      - test-linux
    if: always()
    env:
      REPORT_NAME: ${{ format('OrangeHRM {0} / {1}', github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke', github.event_name == 'workflow_dispatch' && inputs.browser || 'chrome') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Build Allure 3 report
        run: npx --yes allure generate allure-results --config ./allurerc.mjs

      - name: Publish report to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report
          force_orphan: true

      - name: Upload built Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
          if-no-files-found: warn
          retention-days: 7

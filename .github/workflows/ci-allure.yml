name: OrangeHRM Selenium CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
      browser:
        description: "Browser to run"
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge
          - safari
          - all
      env:
        description: "Environment to run against"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - ppe

permissions:
  contents: write

jobs:
  test-linux:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.browser != 'safari')
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            image: selenium/standalone-chrome:latest
          - browser: firefox
            image: selenium/standalone-firefox:latest
          - browser: edge
            image: selenium/standalone-edge:latest
    container:
      image: ${{ matrix.image }}
      options: --shm-size=2g

    env:
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
      TEST_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        if: |
          (github.event_name != 'workflow_dispatch' && matrix.browser == 'chrome') ||
          (github.event_name == 'workflow_dispatch' && (inputs.browser == 'all' || inputs.browser == matrix.browser))
        run: |
          ./gradlew clean test \
            -DsuiteXmlFile=${SUITE}.xml \
            -Dgroups=${SUITE} \
            -Denv=${TEST_ENV} \
            -Dbrowser=${{ matrix.browser }} \
            -Dplatform=local

      - name: Upload Allure results
        if: |
          always() &&
          (
            (github.event_name != 'workflow_dispatch' && matrix.browser == 'chrome') ||
            (github.event_name == 'workflow_dispatch' && (inputs.browser == 'all' || inputs.browser == matrix.browser))
          )
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: |
          always() &&
          (
            (github.event_name != 'workflow_dispatch' && matrix.browser == 'chrome') ||
            (github.event_name == 'workflow_dispatch' && (inputs.browser == 'all' || inputs.browser == matrix.browser))
          )
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/reports
            target/test-results
          if-no-files-found: warn
          retention-days: 14

  test-safari:
    name: Test (safari)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.browser == 'safari' || inputs.browser == 'all')

    env:
      SUITE: ${{ inputs.suite }}
      TEST_ENV: ${{ inputs.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run tests
        run: |
          ./gradlew clean test \
            -DsuiteXmlFile=${SUITE}.xml \
            -Dgroups=${SUITE} \
            -Denv=${TEST_ENV} \
            -Dbrowser=safari \
            -Dplatform=local

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-safari
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-safari
          path: |
            target/reports
            target/test-results
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Publish Allure report
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - test-safari
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: allure-history

      - name: Publish report to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true

      - name: Upload built Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn
          retention-days: 14
